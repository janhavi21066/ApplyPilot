[project]
name = "applypilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy >= 2.1.1",
    "alembic >= 1.20.0",
    "psycopg[binary] >= 3.3.6",
    "pydantic-settings >= 2.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]